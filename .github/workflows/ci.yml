name: CI

on: 
    pull_request:
    push:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps: 
            - uses: actions/checkout@v4

            - name: Enable pnpm
              run: corepack enable

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Typechaek
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USER }}
                  password: ${{ secrets.DOCKER_PASS }}

            - name: Build and push Docker image
              run: |
                  docker build -t ${{ secrets.DOCKER_USER }}/turbo-ci:${{ github.sha }} .
                  docker push ${{ secrets.DOCKER_USER }}/turbo-ci:${{ github.sha }}

    deploy-staging:
        runs-on: ubuntu-latest
        needs: ci
        if: github.ref == 'refs/heads/main' 

        steps: 
            - name: Pull image
              run: docker pull ${{secrets.DOCKER_USER}}/turbo-ci:${{github.sha}}

            - name: Run container
              run: |
                  docker run -d \
                    -p 4000:3001 \
                    -e PORT=3001 \
                    ${{secrets.DOCKER_USER}}/turbo-ci:${{github.sha}}
